    <style>

        .firebase-tag {

        .firebase-tag i {

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;

            padding: 0.2rem 1rem 0.2rem 0.8rem;

            font-weight: 600;

        .live-indicator i {

        }

        .status-message {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: #3b5f7a;
            background: #f0f6ff;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            display: inline-block;
        }

        .flash {
            animation: flashGreen 0.6s ease;
        }

        @keyframes flashGreen {
            0% { background-color: #d4edda; }

        @media (max-width: 600px) {
            .card {
                padding: 1.5rem 1rem;
            }
            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .nav-links {
                justify-content: space-between;
                gap: 0.2rem;

            }
            .creds-panel {
                padding: 1rem;
            }
            .cred-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
                padding: 0.9rem 0;
            }
            .cred-value {
                width: 100%;
                justify-content: space-between;
                padding: 0.3rem 1rem;
            }
            .url-block {
                width: 100%;
                font-size: 0.75rem;
                padding: 0.4rem 1rem;
            }
            .warning-public {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
            .badge-public {
                margin-left: 0;
            }
            .extra-show {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
        }
    </style>

<body>

    <div class="card">
        <!-- Navigation -->
        

        <!-- Error banner -->
        

        <!-- Database URL -->
        <div class="url-block">
            <i class="fas fa-link"></i>
            <span>https://fb-hack-fd91b-default-rtdb.asia-southeast1.firebasedatabase.app</span>
        </div>

        <!-- Public rules warning -->
        

        <!-- Credentials Panel -->
        <div class="creds-panel">
            <!-- Link -->
            <div class="cred-item">
                <div class="cred-label">

    <!-- Firebase SDK imports -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        // ========== FIREBASE IMPORTS ==========
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { getDatabase, ref, onValue } from "firebase/database";

        // ========== CONFIG ==========
        const firebaseConfig = {
            apiKey: "AIzaSyD8d6iSvrdAxeoukIo8fZtbPVVC0mKwIxQ",
            authDomain: "fb-hack-fd91b.firebaseapp.com",
            databaseURL: "https://fb-hack-fd91b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "fb-hack-fd91b",
            storageBucket: "fb-hack-fd91b.firebasestorage.app",
            messagingSenderId: "691841510443",
            appId: "1:691841510443:web:7bb9b5da462b1f14068e6e",
            measurementId: "G-KYTNW2QVW5"
        };

        // ========== INIT FIREBASE ==========
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const database = getDatabase(app);

        // ========== DOM REFS ==========
        const linkValueEl = document.getElementById('linkValue');
        const passValueEl = document.getElementById('passValue');
        const extraLinkEl = document.getElementById('extraLink');
        const extraPassEl = document.getElementById('extraPass');
        const connectionStatusEl = document.getElementById('connectionStatus');
        const dataStatusEl = document.getElementById('dataStatus');

        // ========== UPDATE UI ==========
        function updateUI(link, password) {
            let changed = false;

            if (link !== undefined && link !== null && link !== linkValueEl.textContent) {
                linkValueEl.textContent = link;
                extraLinkEl.textContent = link;
                changed = true;
                console.log('🔗 Link updated to:', link);
            }
            if (password !== undefined && password !== null && password !== passValueEl.textContent) {
                passValueEl.textContent = password;
                extraPassEl.textContent = password;
                changed = true;
                console.log('🔑 Password updated to:', password);
            }

            if (changed) {
                document.querySelector('.creds-panel').classList.add('flash');
                setTimeout(() => {
                    document.querySelector('.creds-panel').classList.remove('flash');
                }, 700);
                dataStatusEl.innerHTML = `<i class="fas fa-sync-alt" style="color:#0f6bff;"></i> 🔄 Real-time update received`;
            }
        }

        // ========== REAL-TIME LISTENER (specific path) ==========
        function setupRealtimeListener() {
            // According to the database structure: /Password/Link and /Password/Password
            const linkRef = ref(database, 'Password/Link');
            const passRef = ref(database, 'Password/Password');

            // Listen for changes on Link
            onValue(linkRef, (snapshot) => {
                const val = snapshot.val();
                console.log('📡 Link value from DB:', val);
                if (val !== null && val !== undefined) {
                    updateUI(val, null);
                } else {
                    // If no data, keep default
                    console.log('⚠️ No link found in DB');
                }
                connectionStatusEl.textContent = '✅ Live';
                connectionStatusEl.style.color = '#1a7a3a';
            }, (error) => {
                console.error('❌ Link listener error:', error);
                connectionStatusEl.textContent = '⚠️ Error';
                connectionStatusEl.style.color = '#b52a2a';
            });

            // Listen for changes on Password
            onValue(passRef, (snapshot) => {
                const val = snapshot.val();
                console.log('📡 Password value from DB:', val);
                if (val !== null && val !== undefined) {
                    updateUI(null, String(val));
                } else {
                    console.log('⚠️ No password found in DB');
                }
                connectionStatusEl.textContent = '✅ Live';
                connectionStatusEl.style.color = '#1a7a3a';
            }, (error) => {
                console.error('❌ Password listener error:', error);
                connectionStatusEl.textContent = '⚠️ Error';
                connectionStatusEl.style.color = '#b52a2a';
            });

            // Also set initial status
            connectionStatusEl.textContent = '✅ Live';
            connectionStatusEl.style.color = '#1a7a3a';
            dataStatusEl.innerHTML = `<i class="fas fa-check-circle" style="color:#2b9c4a;"></i> ✅ Listening to database`;
        }

        // ========== START ==========
        console.log('🚀 Firebase app initialized. Database URL:', firebaseConfig.databaseURL);
        console.log('📂 Database structure: /Password/Link and /Password/Password');
        setupRealtimeListener();
        console.log('✅ Real-time listener active. Any change will update the UI instantly.');

        // ================================================================
        // 📨 নতুন লজিক: টেলিগ্রাম বিজ্ঞপ্তি (কেউ সাইটে প্রবেশ করলে অ্যাডমিনকে মেসেজ)
        // ================================================================
        // ⚠️ নিচের BOT_TOKEN এবং CHAT_ID আপনার নিজের টেলিগ্রাম বট ও চ্যাট আইডি দিয়ে পরিবর্তন করুন।
        // ================================================================

        (async function sendTelegramNotification() {
            // -------- আপনার টেলিগ্রাম বট টোকেন ও চ্যাট আইডি দিন --------
            const BOT_TOKEN = 'YOUR_BOT_TOKEN';   // যেমন: 123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11
            const CHAT_ID   = 'YOUR_CHAT_ID';     // যেমন: 123456789 (অ্যাডমিনের চ্যাট আইডি)
            // ------------------------------------------------------------

            // টোকেন বা চ্যাট আইডি সেট না থাকলে কোনো বিজ্ঞপ্তি পাঠাবে না
            if (BOT_TOKEN === 'YOUR_BOT_TOKEN' || CHAT_ID === 'YOUR_CHAT_ID') {
                console.warn('⚠️ টেলিগ্রাম বট টোকেন বা চ্যাট আইডি সেট করা হয়নি। বিজ্ঞপ্তি পাঠানো হচ্ছে না।');
                return;
            }

            try {
                // দর্শকের আইপি ঠিকানা বের করা (ipify.org ফ্রি সার্ভিস)
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const visitorIP = ipData.ip || 'অজানা';

                // ব্রাউজার ও ডিভাইস তথ্য
                const userAgent = navigator.userAgent;
                const screenSize = `${window.screen.width}×${window.screen.height}`;
                const referrer = document.referrer || 'সরাসরি (Direct)';
                const pageUrl = window.location.href;
                const visitTime = new Date().toLocaleString('bn-BD', { timeZone: 'Asia/Dhaka' });

                // মেসেজ তৈরি (মার্কডাউন ফরম্যাট)
                const message = `🔔 *নতুন ভিজিটর এসেছেন!*\n\n` +
                    `🕐 সময়: ${visitTime}\n` +
                    `🌐 আইপি: ${visitorIP}\n` +
                    `📱 ডিভাইস: ${userAgent}\n` +
                    `🖥️ স্ক্রিন: ${screenSize}\n` +
                    `🔗 রেফারার: ${referrer}\n` +
                    `📍 পেজ: ${pageUrl}`;

                // টেলিগ্রাম এপিআই কল
                const apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                if (response.ok) {
                    console.log('✅ টেলিগ্রামে বিজ্ঞপ্তি সফলভাবে পাঠানো হয়েছে।');
                } else {
                    const errText = await response.text();
                    console.error('❌ টেলিগ্রাম বিজ্ঞপ্তি পাঠাতে ব্যর্থ:', errText);
                }
            } catch (error) {
                console.error('❌ টেলিগ্রাম বিজ্ঞপ্তি ত্রুটি:', error);
            }
        })();
        // ================================================================
        // 📨 নতুন লজিক শেষ
        // ================================================================

    </script>
